# XcodeGen spec for Kashout.
#
# Regenerate the committed Kashout.xcodeproj after editing this file:
#   brew install xcodegen
#   xcodegen generate
#
# Dependency versions are pinned exactly here and in
# Kashout.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved.

name: Kashout

options:
  bundleIdPrefix: com.kashout
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    exactVersion: 13.1.1
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads
    exactVersion: 13.11.0

targets:
  Kashout:
    type: application
    platform: iOS
    sources:
      - path: Kashout
        excludes:
          - "GoogleService-Info.plist"
          - "GoogleService-Info.plist.example"
          - "Info.plist"
      - path: Kashout.storekit
        buildPhase: none
    dependencies:
      - package: Firebase
        product: FirebaseCore
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: GoogleMobileAds
        product: GoogleMobileAds
    info:
      path: Kashout/Info.plist
      properties:
        CFBundleDisplayName: Kashout
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Google's published sample AdMob app ID. It only serves test ads.
        # Replace it with your own app ID before any production use.
        GADApplicationIdentifier: ca-app-pub-3940256099942544~1458002511
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kashout.app
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_PREVIEWS: YES
        # The Firebase config copy step below reads an optional, untracked file.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        OTHER_LDFLAGS: $(inherited) -ObjC
    postBuildScripts:
      - name: Copy Firebase config if present
        basedOnDependencyAnalysis: false
        script: |
          PLIST="${SRCROOT}/Kashout/GoogleService-Info.plist"
          DEST="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/GoogleService-Info.plist"
          if [ -f "$PLIST" ]; then
            cp "$PLIST" "$DEST"
            echo "Kashout: bundled GoogleService-Info.plist (Firebase mode)"
          else
            rm -f "$DEST"
            echo "Kashout: no GoogleService-Info.plist found, the app will run in demo mode"
          fi

  KashoutTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: KashoutTests
    dependencies:
      - target: Kashout
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kashout.app.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Kashout.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Kashout
        BUNDLE_LOADER: $(TEST_HOST)

schemes:
  Kashout:
    build:
      targets:
        Kashout: all
        KashoutTests: [test]
    run:
      config: Debug
      storeKitConfiguration: Kashout.storekit
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - KashoutTests
    archive:
      config: Release
